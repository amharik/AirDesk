name: AirDesk
options:
  bundleIdPrefix: com.airdesk
  deploymentTarget:
    iOS: "17.5"
  createIntermediateGroups: true
  developmentLanguage: en
  xcodeVersion: "16.4"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.5"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    GCC_WARN_UNUSED_VARIABLE: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
packages:
  GoogleCast:
    url: https://github.com/googlecast/google-cast-ios-sdk
    exactVersion: 4.8.4
  FlatBuffers:
    url: https://github.com/google/flatbuffers
    exactVersion: 25.12.19
  IrohLib:
    url: https://github.com/n0-computer/iroh-ffi
    exactVersion: 1.2.0
  SwiftNIO:
    url: https://github.com/apple/swift-nio.git
    exactVersion: 2.104.0
  SwiftNIOSSH:
    url: https://github.com/apple/swift-nio-ssh.git
    exactVersion: 0.15.1
  SwiftCrypto:
    url: https://github.com/apple/swift-crypto.git
    exactVersion: 4.5.2
  OpenSSL:
    url: https://github.com/krzyzanowskim/OpenSSL-Package.git
    exactVersion: 3.6.5000
  AirDeskCore:
    path: core/airdesk-ffi/apple
targets:
  AirDesk:
    type: application
    platform: iOS
    sources:
      - path: AirDesk
        excludes:
          - "Resources/**"
          - "**/*.md"
      - path: AirDesk/Resources/ResourceRoot.swift
      - path: AirDesk/Resources/ResourceTransferService.swift
      - path: AirDesk/Resources/DesktopShell
        type: folder
      - path: AirDesk/Resources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.airdesk.ios
        PRODUCT_NAME: AirDesk
        AIRDESK_CAST_RECEIVER_APP_ID: ""
        INFOPLIST_FILE: AirDesk/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_PREVIEWS: NO
        OTHER_LDFLAGS: "$(inherited) -framework Network"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) AIRDESK_CORE_SMOKE"
    dependencies:
      - package: AirDeskCore
        product: AirDeskCore
      - package: GoogleCast
        product: GoogleCastDynamic
      - package: FlatBuffers
        product: FlatBuffers
      - package: IrohLib
        product: IrohLib
      - package: SwiftNIO
        product: NIOCore
      - package: SwiftNIO
        product: NIOPosix
      - package: SwiftNIOSSH
        product: NIOSSH
      - package: SwiftCrypto
        product: Crypto
      - package: OpenSSL
        product: OpenSSL
  AirDeskTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AirDeskTests
    dependencies:
      - target: AirDesk
      - package: SwiftNIO
        product: NIOCore
      - package: SwiftNIO
        product: NIOPosix
      - package: SwiftNIOSSH
        product: NIOSSH
      - package: SwiftCrypto
        product: Crypto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.airdesk.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AirDesk.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/AirDesk"
        BUNDLE_LOADER: "$(TEST_HOST)"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) AIRDESK_CORE_SMOKE"
  AirDeskUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AirDeskUITests
    dependencies:
      - target: AirDesk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.airdesk.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AirDesk
schemes:
  AirDesk:
    build:
      targets:
        AirDesk: all
        AirDeskTests: [test]
    run:
      config: Debug
      storeKitConfiguration: AirDesk/Resources/AirDesk.storekit
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - AirDeskTests
  AirDeskUITests:
    build:
      targets:
        AirDesk: all
        AirDeskUITests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - AirDeskUITests
