name: AirDesk
options:
  bundleIdPrefix: com.airdesk
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  xcodeVersion: "16.4"
  schemePathPrefix: "../../../"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    GCC_WARN_UNUSED_VARIABLE: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
packages:
  GoogleCast:
    url: https://github.com/googlecast/google-cast-ios-sdk
    exactVersion: 4.8.4
targets:
  AirDesk:
    type: application
    platform: iOS
    sources:
      - path: AirDesk
        excludes:
          - "Resources/**"
          - "**/*.md"
      - path: AirDesk/Resources/DesktopShell
        type: folder
      - path: AirDesk/Resources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.airdesk.ios
        PRODUCT_NAME: AirDesk
        AIRDESK_CAST_RECEIVER_APP_ID: ""
        INFOPLIST_FILE: AirDesk/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    dependencies:
      - package: GoogleCast
        product: GoogleCastDynamic
  AirDeskTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AirDeskTests
    dependencies:
      - target: AirDesk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.airdesk.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AirDesk.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/AirDesk"
        BUNDLE_LOADER: "$(TEST_HOST)"
  AirDeskUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AirDeskUITests
    dependencies:
      - target: AirDesk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.airdesk.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AirDesk
schemes:
  AirDesk:
    build:
      targets:
        AirDesk: all
        AirDeskTests: [test]
    run:
      config: Debug
      storeKitConfiguration: AirDesk/Resources/AirDesk.storekit
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - AirDeskTests
  AirDeskUITests:
    build:
      targets:
        AirDesk: all
        AirDeskUITests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - AirDeskUITests
