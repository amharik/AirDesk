name: iOS

on:
  workflow_dispatch:
  push:
    paths:
      - "AirDesk/**"
      - "AirDeskTests/**"
      - "AirDeskUITests/**"
      - "core/airdesk-ffi/**"
      - "project.yml"
      - "scripts/build-core-apple.sh"
      - "scripts/ci-ios.sh"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "AirDesk/**"
      - "AirDeskTests/**"
      - "AirDeskUITests/**"
      - "core/airdesk-ffi/**"
      - "project.yml"
      - "scripts/build-core-apple.sh"
      - "scripts/ci-ios.sh"
      - ".github/workflows/ios.yml"

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"
      - run: brew install xcodegen
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - name: Run iOS tests
        run: |
          set -o pipefail
          ./scripts/ci-ios.sh 2>&1 | tee /tmp/ci-ios.log
      - name: Report iOS failures
        if: failure()
        run: |
          grep -E "error:|FAILED|The following build commands failed|Testing failed|Test Case .* failed|Assertion failed" /tmp/ci-ios.log | tail -40 | while IFS= read -r line; do
            printf '::error::%s\n' "${line//$'\n'/ }"
          done
