name: Debug release

on:
  push:
    tags:
      - "debug-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example debug-2026-11-09"
        required: true
        type: string

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"
      - run: brew install xcodegen
      - name: Build unsigned iOS debug artifacts
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild build \
            -project AirDesk.xcodeproj \
            -scheme AirDesk \
            -configuration Debug \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/ios-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          mkdir -p build/ios-ipa/Payload
          cp -R build/ios-device/Build/Products/Debug-iphoneos/AirDesk.app build/ios-ipa/Payload/
          (cd build/ios-ipa && zip -qry ../AirDesk-ios-device-unsigned.ipa Payload)
          xcodebuild build \
            -project AirDesk.xcodeproj \
            -scheme AirDesk \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/ios-simulator \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          ditto -c -k --keepParent \
            build/ios-simulator/Build/Products/Debug-iphonesimulator/AirDesk.app \
            build/AirDesk-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ios-debug
          path: |
            build/AirDesk-ios-device-unsigned.ipa
            build/AirDesk-ios-simulator.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/debug-') || inputs.tag != ''
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish GitHub debug release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p release
          cp artifacts/android-debug/app-debug.apk "release/AirDesk-${TAG}-android-debug.apk"
          cp artifacts/ios-debug/AirDesk-ios-device-unsigned.ipa "release/AirDesk-${TAG}-ios-device-unsigned.ipa"
          cp artifacts/ios-debug/AirDesk-ios-simulator.zip "release/AirDesk-${TAG}-ios-simulator.zip"
          cat > release-notes.md <<EOF
          Debug builds for testing only. These are not App Store or signed distribution builds.

          - Android: installable debug APK.
          - iOS device: unsigned debug IPA. Re-sign with your own development certificate and provisioning profile before installing.
          - iOS simulator: zipped debug app. Install with \`xcrun simctl install booted AirDesk.app\`.

          Commit: ${GITHUB_SHA}
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* \
              --title "AirDesk debug ${TAG}" \
              --notes-file release-notes.md \
              --prerelease
          fi
