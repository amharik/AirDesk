name: Debug release

on:
  push:
    tags:
      - "debug-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example debug-2026-11-09"
        required: true
        type: string

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Gradle 8.9
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gradle-8.9-bin.zip"
          for url in \
            "https://mirrors.cloud.tencent.com/gradle/gradle-8.9-bin.zip" \
            "https://mirrors.huaweicloud.com/gradle/gradle-8.9-bin.zip"; do
            if curl -fsSL --retry 3 --retry-delay 5 "${url}" -o "${archive}"; then
              break
            fi
          done
          echo "d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab  ${archive}" | sha256sum -c -
          unzip -q "${archive}" -d "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/gradle-8.9/bin" >> "${GITHUB_PATH}"
      - name: Build Android debug APK
        working-directory: android
        run: gradle testDebugUnitTest lintDebug assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"
      - run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Seed Swift package binary artifacts
        run: |
          set -euo pipefail
          cache_dir="${HOME}/Library/Caches/org.swift.swiftpm/artifacts"
          mkdir -p "${cache_dir}"
          seed() {
            name="$1"
            url="$2"
            checksum="$3"
            dest="${cache_dir}/${name}"
            if [ -f "${dest}" ]; then
              return 0
            fi
            tmp="$(mktemp)"
            for prefix in "https://ghproxy.net/" "https://ghfast.top/" ""; do
              if curl -fsSL --retry 3 --retry-delay 5 -o "${tmp}" "${prefix}${url}"; then
                if echo "${checksum}  ${tmp}" | shasum -a 256 -c - >/dev/null; then
                  mv "${tmp}" "${dest}"
                  return 0
                fi
              fi
              rm -f "${tmp}"
            done
            return 1
          }
          seed \
            "https___github_com_n0_computer_iroh_ffi_releases_download_v1_2_0_IrohLib_xcframework_zip" \
            "https://github.com/n0-computer/iroh-ffi/releases/download/v1.2.0/IrohLib.xcframework.zip" \
            "4a97b06ecb1d418e17a96a45b6c7e5d063a12a6dfb6600389a7b5b2ae21ae18a"
          seed \
            "https___github_com_krzyzanowskim_OpenSSL_releases_download_3_6_5000_OpenSSL_xcframework_zip" \
            "https://github.com/krzyzanowskim/OpenSSL/releases/download/3.6.5000/OpenSSL.xcframework.zip" \
            "f50188506490c643715489217d32e458d06cee5579399ff616f0ce2038169fea"
      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project AirDesk.xcodeproj
      - name: Build iOS simulator app
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/ios-simulator.log"
          if xcodebuild build \
            -project AirDesk.xcodeproj \
            -scheme AirDesk \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "${GITHUB_WORKSPACE}/build/ios-simulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" >"${log}" 2>&1; then
            ditto -c -k --keepParent \
              "${GITHUB_WORKSPACE}/build/ios-simulator/Build/Products/Debug-iphonesimulator/AirDesk.app" \
              "${GITHUB_WORKSPACE}/build/AirDesk-ios-simulator.zip"
          else
            rc=$?
            tail -40 "${log}" | while IFS= read -r line; do
              echo "::error title=iOS simulator build::${line}"
            done
            tail -200 "${log}"
            exit "${rc}"
          fi
      - name: Build unsigned iOS device IPA
        continue-on-error: true
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/ios-device.log"
          if xcodebuild build \
            -project AirDesk.xcodeproj \
            -scheme AirDesk \
            -configuration Debug \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "${GITHUB_WORKSPACE}/build/ios-device" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" >"${log}" 2>&1; then
            mkdir -p "${GITHUB_WORKSPACE}/build/ios-ipa/Payload"
            cp -R \
              "${GITHUB_WORKSPACE}/build/ios-device/Build/Products/Debug-iphoneos/AirDesk.app" \
              "${GITHUB_WORKSPACE}/build/ios-ipa/Payload/"
            (cd "${GITHUB_WORKSPACE}/build/ios-ipa" && zip -qry ../AirDesk-ios-device-unsigned.ipa Payload)
          else
            rc=$?
            tail -40 "${log}" | while IFS= read -r line; do
              echo "::error title=iOS unsigned device build::${line}"
            done
            tail -200 "${log}"
            exit "${rc}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ios-debug
          path: build/AirDesk-ios-*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/debug-') || inputs.tag != ''
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish GitHub debug release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/release.log"
          if {
            mkdir -p release
            cp artifacts/android-debug/app-debug.apk "release/AirDesk-${TAG}-android-debug.apk"
            cp artifacts/ios-debug/AirDesk-ios-simulator.zip "release/AirDesk-${TAG}-ios-simulator.zip"
            if [ -f artifacts/ios-debug/AirDesk-ios-device-unsigned.ipa ]; then
              cp artifacts/ios-debug/AirDesk-ios-device-unsigned.ipa "release/AirDesk-${TAG}-ios-device-unsigned.ipa"
            fi
            cat > release-notes.md <<EOF
          Debug builds for testing only. These are not App Store or signed distribution builds.

          - Android: installable debug APK.
          - iOS simulator: zipped debug app. Install with \`xcrun simctl install booted AirDesk.app\`.
          - iOS device: unsigned debug IPA when included. Re-sign with your own development certificate and provisioning profile before installing.

          Commit: ${GITHUB_SHA}
          EOF
            if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              gh release upload "$TAG" release/* --repo "${GITHUB_REPOSITORY}" --clobber
            else
              gh release create "$TAG" release/* \
                --repo "${GITHUB_REPOSITORY}" \
                --title "AirDesk debug build ${TAG#debug-}" \
                --notes-file release-notes.md \
                --prerelease
            fi
          } >"${log}" 2>&1; then
            cat "${log}"
          else
            rc=$?
            tail -40 "${log}" | while IFS= read -r line; do
              echo "::error title=Release publish::${line}"
            done
            tail -200 "${log}"
            exit "${rc}"
          fi
