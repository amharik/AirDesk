name: Android

on:
  push:
    paths:
      - "android/**"
      - "core/airdesk-ffi/**"
      - "protocol/airdesk.fbs"
      - "protocol/generated/kotlin/**"
      - "scripts/build-core-android.sh"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "core/airdesk-ffi/**"
      - "protocol/airdesk.fbs"
      - "protocol/generated/kotlin/**"
      - "scripts/build-core-android.sh"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build shared core bindings
        run: ./scripts/build-core-android.sh
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint and assemble
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug --console=plain
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/tests/testDebugUnitTest
            android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
