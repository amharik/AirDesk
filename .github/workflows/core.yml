name: Core

on:
  push:
    paths:
      - "core/**"
      - "protocol/generated/rust/**"
      - "protocol/fixtures/**"
      - "scripts/build-core-apple.sh"
      - "scripts/build-core-android.sh"
      - "scripts/build-core-wasm.sh"
      - ".github/workflows/core.yml"
  pull_request:
    paths:
      - "core/**"
      - "protocol/generated/rust/**"
      - "protocol/fixtures/**"
      - "scripts/build-core-apple.sh"
      - "scripts/build-core-android.sh"
      - "scripts/build-core-wasm.sh"
      - ".github/workflows/core.yml"

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path core/Cargo.toml --all -- --check
      - name: Clippy
        run: cargo clippy --manifest-path core/Cargo.toml --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path core/Cargo.toml --workspace --locked

  bindings:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      - name: Build host uniffi library
        run: cargo build --manifest-path core/Cargo.toml -p airdesk-ffi --lib
      - name: Generate and verify checked-in bindings
        run: |
          set -euo pipefail
          cd core
          LIB="$(find target/debug/deps -maxdepth 1 -name 'libairdesk_ffi.so' | head -1)"
          cargo run --quiet -p airdesk-ffi --bin uniffi-bindgen -- \
            generate --library "$LIB" --language swift --out-dir /tmp/airdesk-swift
          cargo run --quiet -p airdesk-ffi --bin uniffi-bindgen -- \
            generate --library "$LIB" --language kotlin --out-dir /tmp/airdesk-kotlin
          cmp /tmp/airdesk-swift/airdesk_ffi.swift \
            airdesk-ffi/apple/Sources/AirDeskCore/AirDeskCore.swift
          diff -ru /tmp/airdesk-kotlin/com airdesk-ffi/generated/kotlin/com

  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Build deterministic wasm
        run: AIRDESK_CORE_WASM_VERIFY_DETERMINISM=1 ./scripts/build-core-wasm.sh

  daemon:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      - run: cargo test --manifest-path core/airdeskd/Cargo.toml --locked
