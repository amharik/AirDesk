name: Protocol

on:
  push:
    paths:
      - "protocol/**"
      - "AirDesk/Protocol/Generated/**"
      - "web/src/protocol/generated/**"
      - ".github/workflows/protocol.yml"
  pull_request:
    paths:
      - "protocol/**"
      - "AirDesk/Protocol/Generated/**"
      - "web/src/protocol/generated/**"
      - ".github/workflows/protocol.yml"

jobs:
  schema:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned flatc
        run: |
          git clone --depth 1 --branch v25.12.19 https://github.com/google/flatbuffers.git /tmp/flatbuffers
          cmake -S /tmp/flatbuffers -B /tmp/flatbuffers/build -DCMAKE_BUILD_TYPE=Release -DFLATBUFFERS_BUILD_TESTS=OFF
          cmake --build /tmp/flatbuffers/build --target flatc -j 2
          echo "FLATC=/tmp/flatbuffers/build/flatc" >> "$GITHUB_ENV"
      - run: ./protocol/check.sh

  host-abi:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned wasm-tools
        run: |
          curl -L --fail -o /tmp/wasm-tools.tar.gz https://github.com/bytecodealliance/wasm-tools/releases/download/v1.263.0/wasm-tools-1.263.0-x86_64-linux.tar.gz
          mkdir -p /tmp/wasm-tools
          tar -xzf /tmp/wasm-tools.tar.gz -C /tmp/wasm-tools --strip-components=1
          echo "WASM_TOOLS=/tmp/wasm-tools/wasm-tools" >> "$GITHUB_ENV"
      - run: ./protocol/abi/check.sh
      - run: ./protocol/abi/conformance/check.sh

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --manifest-path protocol/rust/Cargo.toml

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test -- test/protocol.test.ts test/movement.test.ts
