[workspace]
members = [
  "airdesk-core",
  "airdesk-protocol",
  "airdesk-pairing",
  "airdesk-ffi",
  "airdesk-wasm",
]
exclude = ["airdeskd"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
publish = false

[workspace.dependencies]
airdesk-core = { path = "airdesk-core" }
airdesk-pairing = { path = "airdesk-pairing" }
airdesk-protocol = { path = "airdesk-protocol" }
