[package]
name = "airdesk-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
airdesk-core.workspace = true
airdesk-pairing.workspace = true
airdesk-protocol.workspace = true
airdesk-sync.workspace = true
thiserror = "2"
uniffi = { version = "0.31.1", features = ["cli"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
