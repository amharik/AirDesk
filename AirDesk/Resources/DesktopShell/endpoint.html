<!doctype html>
<html lang="en" data-appearance="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="color-scheme" content="dark light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' 'sha256-a5qOmWtV4zivHG9TzYCcBDIYXWtamE0rSi+b/aPFeYw=' 'sha256-vWvTHbd5URFC6ZXdJfBcriueY7hIyWP2o0+8ycL5u40='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws://127.0.0.1:*; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>AirDesk — Browser Display</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07090d;
      --panel: rgba(20, 25, 34, 0.82);
      --line: rgba(255, 255, 255, 0.09);
      --text: rgba(255, 255, 255, 0.92);
      --muted: rgba(255, 255, 255, 0.54);
      --faint: rgba(255, 255, 255, 0.34);
      --accent: #7fd8c8;
      --warn: #f0b46f;
      --danger: #f08181;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    }
    body::before {
      content: "";
      position: fixed;
      inset: -20%;
      pointer-events: none;
      background:
        radial-gradient(circle at 18% 12%, rgba(78, 147, 255, 0.2), transparent 34%),
        radial-gradient(circle at 82% 24%, rgba(127, 216, 200, 0.14), transparent 30%),
        radial-gradient(circle at 54% 92%, rgba(179, 126, 255, 0.12), transparent 36%);
      filter: blur(28px);
    }
    main {
      position: relative;
      width: min(760px, 100%);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 34px;
      background: var(--panel);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(24px);
    }
    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 30px;
    }
    .brand {
      display: grid;
      gap: 5px;
    }
    .eyebrow {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: var(--accent);
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 44px);
      font-weight: 650;
      letter-spacing: -0.04em;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-width: 132px;
      justify-content: center;
      padding: 9px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 650;
      white-space: nowrap;
    }
    .indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--faint);
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.04);
    }
    .indicator[data-status="connected"] { background: var(--accent); box-shadow: 0 0 0 4px rgba(127, 216, 200, 0.12); }
    .indicator[data-status="connecting"],
    .indicator[data-status="registering"] { background: var(--warn); box-shadow: 0 0 0 4px rgba(240, 180, 111, 0.12); }
    .indicator[data-status="failed"] { background: var(--danger); box-shadow: 0 0 0 4px rgba(240, 129, 129, 0.12); }
    .detail {
      margin: 0 0 24px;
      max-width: 58ch;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }
    .error {
      min-height: 20px;
      margin: 0 0 20px;
      color: var(--danger);
      font-size: 12px;
      line-height: 1.5;
      word-break: break-word;
    }
    .surface {
      display: block;
      width: 100%;
      max-height: 62vh;
      margin: 0 0 24px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.25);
      object-fit: contain;
    }
    .surface[hidden] { display: none; }
    dl {
      display: grid;
      grid-template-columns: 120px minmax(0, 1fr);
      gap: 12px 18px;
      margin: 0 0 28px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.025);
    }
    dt {
      color: var(--faint);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    dd {
      margin: 0;
      overflow: hidden;
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      flex-wrap: wrap;
    }
    .note {
      max-width: 44ch;
      color: var(--faint);
      font-size: 11px;
      line-height: 1.5;
    }
    button {
      appearance: none;
      border: 1px solid rgba(127, 216, 200, 0.38);
      border-radius: 12px;
      padding: 11px 16px;
      background: rgba(127, 216, 200, 0.12);
      color: var(--accent);
      font: inherit;
      font-size: 13px;
      font-weight: 650;
      cursor: pointer;
      transition: opacity 140ms ease, background 140ms ease;
    }
    button:hover:not(:disabled) { background: rgba(127, 216, 200, 0.18); }
    button:disabled { cursor: default; opacity: 0.38; }
    @media (max-width: 560px) {
      body { padding: 16px; }
      main { padding: 24px; border-radius: 20px; }
      header { flex-direction: column; gap: 18px; }
      dl { grid-template-columns: 1fr; gap: 6px 0; }
      dd { white-space: normal; word-break: break-word; }
    }
  </style>
</head>
<body>
  <main aria-labelledby="endpoint-title">
    <header>
      <div class="brand">
        <span class="eyebrow">AirDesk / Browser Display</span>
        <h1 id="endpoint-title">Display session</h1>
      </div>
      <div class="status" role="status" aria-live="polite">
        <span class="indicator" id="endpoint-indicator" data-status="idle" aria-hidden="true"></span>
        <span id="endpoint-status">Idle</span>
      </div>
    </header>

    <p class="detail" id="endpoint-detail">
      This display is connecting to the local AirDesk host over loopback.
    </p>
    <p class="error" id="endpoint-error" role="alert"></p>

    <img class="surface" id="endpoint-surface" alt="AirDesk workspace surface" hidden>

    <dl>
      <dt>Workspace</dt>
      <dd id="endpoint-workspace">—</dd>
      <dt>Display</dt>
      <dd id="endpoint-display">—</dd>
      <dt>Loopback</dt>
      <dd id="endpoint-url">—</dd>
    </dl>

    <footer>
      <span class="note">
        This page is a view-only presentation endpoint. It cannot write workspace state.
      </span>
      <button type="button" id="endpoint-reconnect">Reconnect</button>
    </footer>
  </main>
  <script src="endpoint.js"></script>
</body>
</html>
